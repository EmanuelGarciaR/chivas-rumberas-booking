<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chivas Rumberas Medellín</title>
    <link rel="shortcut icon" href="assets/icons/logo-chiva-ia.svg" type="image/x-icon">

    <script src="https://kit.fontawesome.com/2c27531862.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/main.css">
    
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="nav__brand">
                <a href="#" class="nav__logo-link">
                    <img class="nav__logo" src="assets/icons/logo-chiva-ia.svg" alt="Logo Chiva Rumberas">
                </a>
                <h1 class="nav__title">Chivas rumberas Medellín</h1>
            </div>
            <div class="nav__menu-wrapper">
                <ul class="nav__list">
                    <li class="nav__item"><a class="nav__link" href="#">La experiencia</a></li>
                    <li class="nav__item"><a class="nav__link" href="#">Nuestras chivas</a></li>
                    <li class="nav__item"><a class="nav__link" href="#">Cómo funciona</a></li>
                    <li class="nav__item"><a class="nav__link" href="#">FAQ</a></li>
                    <li class="nav__item"><a class="btn btn--primary " href="#">Reservar ahora <i class="fa-solid fa-arrow-up-right-from-square btn__icon"></i></a></li>
                </ul>
            </div>
        </nav>
    </header>


    <section class="hero">
        
        <article class="hero__content">
            <p class="hero__location">Medellín, Colombia</p>
            <h2 class="hero__title">La noche<br>
                <span class="hero__title--enfasis">se enciende</span><br>
                en Medallo.
            </h2>

            <p class="hero__description">La experiencia paisa que convierte cualquier<br>celebración en una historia para contar.</p>
        </article>

        <article class="hero__actions">
            <button class="btn btn--primary">Arma tu parche! <i class="fa-solid fa-arrow-up-right-from-square btn__icon"></i></button>
            <button class="btn btn--secondary">Conoce nuestras chivas <i class="fa-solid fa-angles-down btn__icon"></i></button>
        </article>
    </section>


    
</body>
</html>
